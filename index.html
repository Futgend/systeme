<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Ma journée</title>
<meta name="theme-color" content="#C44B56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma journée">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EFE6D8; --card:#FBF5EB; --warm:#F4EADB;
  --line:#E2D4C1; --line2:#CDB9A1;
  --t1:#2E2622; --t2:#6E5F53; --t3:#A09080;
  --ink:#2E2622; --bord:#2E2622;
  --ombre:3px 3px 0 #2E2622; --ombre-s:2px 2px 0 #2E2622;
  --sun:#F3A155; --sunbg:#FBE2C8;
  --sea:#7BA23F; --seabg:#D3E6A0; --olive:#C9D98A; --vert-texte:#3E5222;
  --moon:#7D6A8C; --moonbg:#E9E2EE;
  --alert:#C44B56; --alertbg:#F3D6D8;
  --free:#E6D9C6;
  --day:#C98A4B; --daybg:#F1DFCB;
  --ciel:#3F6E61; --cielbg:#B3CFC3;
  --creme:#FFF8EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t1);
  font-family:Poppins,ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.date{font-size:20px;font-weight:500;text-transform:capitalize}
.clock{font-size:14px;color:var(--t2)}

.tabs{display:flex;gap:4px;background:var(--free);padding:3px;border-radius:16px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--t2);font:inherit;
  font-size:14px;padding:9px 0;border-radius:13px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--t1);font-weight:500}

.budget{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:15px 16px;margin-bottom:16px}
.big{font-size:32px;font-weight:500;letter-spacing:-.02em}
.biglab{font-size:14px;color:var(--t2);margin-left:7px}
.duo{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:4px}
.bt-tete{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 2px}
.bcalc{font-size:12.5px;color:var(--t2);margin-top:6px;line-height:1.45}
.bcalc:empty{display:none}
.bsous{font-size:12.5px;color:var(--t2);margin-top:2px}
.bsous:empty{display:none}
.ky-tot{margin-left:auto;color:var(--t3)}
.bcalc b{color:var(--t1);font-weight:600}
.part-etat.replay{color:var(--sun);font-weight:600;background:var(--card);border-radius:11px;padding:4px 10px}
.t.evt.replay .nm{color:var(--t2)}
.duo .biglab{display:block;margin-left:0}
.gauge{display:flex;height:13px;border-radius:9px;overflow:hidden;margin:12px 0 9px;background:var(--free)}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--t2)}
.key span{display:flex;align-items:center;gap:5px}
.sq{width:10px;height:10px;border-radius:50%;display:inline-block}

.moment{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:14px 15px;margin-bottom:12px}
.moment.drop{border-color:var(--sea);border-style:dashed;background:var(--seabg)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.mname{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.ic{width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
.mfree{font-size:12.5px;color:var(--t2)}

.t{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border-radius:15px;
  background:var(--warm);margin-bottom:6px;cursor:pointer}
.tc{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.emo{display:inline-block;margin-right:.12em;text-decoration:none}
.t .nm{font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px}
.t .ring,.t .heure,.t .choisir{margin-top:0}
.t .dur{font-size:11.5px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.t.done .nm{text-decoration:line-through;color:var(--t3)}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;cursor:pointer}
.ring.p{border-color:var(--sea)}
.ring.full{background:var(--sea);border-color:var(--sea)}
.tag{font-size:10.5px;padding:2px 7px;border-radius:7px;background:var(--moonbg);
  color:var(--moon);flex-shrink:1;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ech{font-size:10.5px;padding:2px 8px;border-radius:8px;flex-shrink:0;white-space:nowrap}
.ech-dur{background:var(--alertbg);color:var(--alert);font-weight:600}
.ech-rampe{background:var(--sunbg);color:var(--sun);font-weight:500}
.ech-loin{background:var(--free);color:var(--t2)}
.t.urgent{box-shadow:inset 3px 0 0 var(--alert)}
.reveil{border:0;background:var(--moonbg);color:var(--moon);border-radius:12px;padding:4px 10px;
  font:inherit;font-size:12px;cursor:pointer;flex-shrink:0}
.anp{background:var(--card);border:1px solid var(--alertbg);border-radius:22px;padding:13px 15px;margin-bottom:12px}
.anp-t{font-size:13px;color:var(--alert);font-weight:500;margin-bottom:9px}

.jcols{display:flex;flex-direction:column}
#rappels{order:-1}
.rappels{background:#fdf6e4;border:1px solid #f1e3bd;border-radius:20px;padding:12px 14px 10px;margin-bottom:12px}
.rap-t{font-size:13px;font-weight:600;color:#a8862f;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.rap-t span{font-weight:400;color:#c4a868}
.rap{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px dashed #ecdcae}
.rap:first-of-type{border-top:0}
.rap-c{flex:1;min-width:0;cursor:pointer}
.rap-x{font-size:14px;line-height:1.35;color:var(--t1)}
.rap-i{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;align-items:center}
.rap-d{font-size:11px;color:#b0904a}
.rap-tard{margin-top:4px;font-size:12px;color:#b0904a}
.rap-tard summary{cursor:pointer;padding:3px 0}
.rap-tard .rap{opacity:.75}
.rap-ok{border:1px solid #ecdcae;background:#fffaf0;color:#a8862f;border-radius:10px;font:inherit;font-size:12px;
  padding:3px 9px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.reserve{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 15px;margin-top:12px}
.rtitre{font-size:15px;font-weight:500}
.rtitre span{color:var(--t3);font-weight:400;font-size:13px}
.derniere{font-size:11.5px;color:var(--moon);white-space:nowrap}
.rsec{font-size:12px;color:var(--t2);margin:14px 2px 6px}
.rfiltres{display:flex;flex-wrap:nowrap;gap:5px;margin:0 0 10px;overflow:hidden}
.rfiltres.ouverts{flex-wrap:wrap}
.rfiltres:empty{display:none}
.rfiltres button{border:1px solid var(--line);background:var(--card);color:var(--t2);border-radius:12px;padding:3px 9px;
  font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap;flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.rfiltres.ouverts button{max-width:none}
.rfiltres .rf-plus{flex-shrink:0;color:var(--t3);border-style:dashed}
.rfiltres button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.rgrp{font-size:11.5px;color:var(--t3);font-weight:600;margin:12px 2px 5px}
.replays summary{font-weight:500}
.rep-lim{font-size:11.5px;font-weight:500;color:var(--sun);margin-left:4px}
.rep-lim.ech{padding:1px 7px}
.t.evt{background:var(--cielbg);box-shadow:inset 3px 0 0 var(--ciel);cursor:default!important}
.t.evt .heure{font-size:12.5px;font-weight:600;color:var(--ciel);min-width:36px;flex-shrink:0}
.t.evt .heure{display:flex;flex-direction:column;line-height:1.25}
.t.evt .heure small{font-size:11px;font-weight:500;opacity:.7}
.t.evt.non .nm{color:var(--t3)}
.evbtns{display:flex;gap:5px;flex-shrink:0}
.part{border:0;background:var(--card);color:var(--t2);border-radius:11px;padding:4px 9px;
  font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
.part[data-part="oui"]{color:var(--sea)}
.part-x{border:0;background:transparent;color:var(--t3);font:inherit;font-size:13px;cursor:pointer;padding:2px 4px}
.fx-evt{display:block;text-align:left;color:var(--ciel);margin:2px 0 4px;padding:4px 0;white-space:normal}
.part-arch{border:1px dashed var(--line2);background:transparent;color:var(--t3);border-radius:11px;padding:3px 8px;
  font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.part-arch.on{border-style:solid;color:var(--t2);background:var(--card)}
.part-etat{border:0;background:transparent;font:inherit;font-size:11.5px;color:var(--t3);cursor:pointer;padding:4px 6px;white-space:nowrap}
.part-etat.oui{color:var(--sea);font-weight:600;background:var(--card);border-radius:11px;padding:4px 10px}
.rdv{color:var(--ciel);margin-top:8px}
.gtitre{grid-column:1/-1;font-size:13px;color:var(--t2);font-weight:500;margin:8px 2px 0}
.livres{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px 34px}
.livre{border:1px solid #e6d9ee;background:var(--card);color:var(--moon);border-radius:13px;padding:5px 11px;
  font:inherit;font-size:12.5px;cursor:pointer}
.livre span{color:var(--t3);margin-left:6px;font-size:11.5px}
.livre.lu{background:var(--seabg);border-color:var(--seabg);color:var(--sea)}
.bk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:7px}
.bk .t1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.mbar{flex:1;min-width:30px;height:5px;background:var(--free);border-radius:3px;overflow:hidden}
.mbar i{display:block;height:5px;background:var(--pc,var(--sea));border-radius:3px}
.bk .pc{font-size:11.5px;color:var(--t2);white-space:nowrap}
.livre-ligne{padding:6px 4px 8px;border-bottom:1px solid var(--line)}
.livre-ligne .bk{margin-top:0}
.livre-ligne .a{font-size:12px;color:var(--t2);margin-top:3px}
.pev{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:7px 4px;border-bottom:1px solid var(--line)}
.pev .d{color:var(--ciel);font-weight:600;white-space:nowrap;flex-shrink:0}
.pev .n{min-width:0;flex:1;line-height:1.35}
.pev .s{margin-left:auto;font-size:11.5px;color:var(--t3);white-space:nowrap;flex-shrink:0}
@media(max-width:520px){.pev{flex-wrap:wrap;row-gap:2px}.pev .s{margin-left:0;flex-basis:100%;padding-left:2px}}
.possibles{margin-top:14px}
.possibles summary{font-size:12.5px;color:var(--t2);cursor:pointer;padding:4px 2px;list-style-position:inside}
.possibles[open] summary{margin-bottom:6px}
.t.evt.possible{background:var(--card);box-shadow:inset 3px 0 0 var(--line2)}
.t.evt.possible .heure{color:var(--t2)}
.t.evt.facu{cursor:grab!important}
.choisir{border:0;width:26px;height:26px;border-radius:13px;background:var(--cielbg);color:var(--ciel);
  font:inherit;font-size:16px;line-height:1;cursor:pointer;flex-shrink:0}
.t.elan{background:var(--moonbg);border:1.5px dashed #d9c8e6;padding:8.5px 9.5px}
.t.pj{background:var(--pcbg)}
.t.pj.kc:not(.done){background:var(--kc)}
.t.pj .ring{border-color:color-mix(in srgb,var(--pc) 50%,var(--line2))}
.t.pj .ring.p{border-color:var(--sea)}
.t.elan.pj{border-color:color-mix(in srgb,var(--pc) 55%,transparent)}
.t.elan.pj .boucle{color:var(--pc)}
.t.elan.pj .var{border-color:color-mix(in srgb,var(--pc) 35%,transparent);color:var(--pc)}
.t.elan.pj .var.on{background:var(--pc);border-color:var(--pc);color:#fff}
.t.elan.pj.fait .ring{background:var(--pc);border-color:var(--pc)}
.t.elan .boucle{color:var(--moon);font-size:14px;line-height:1;margin:3px -3px 0 -4px}
.t.elan.fait .ring{background:var(--moon);border-color:var(--moon)}
.t.elan.fait .nm{text-decoration:line-through;color:var(--t3)}
.t.elan.fait{opacity:.85}
.t.done,.t.elan.fait{background:color-mix(in srgb,var(--seabg) 78%,var(--pcbg,var(--warm)));box-shadow:inset 3px 0 0 var(--sea);opacity:1}
.t.elan.fait{border-color:color-mix(in srgb,var(--sea) 50%,transparent)}
.t.done .nm,.t.elan.fait .nm{color:var(--t2);text-decoration-color:color-mix(in srgb,var(--sea) 60%,var(--t3))}
.ring.full,.t.elan.fait .ring,.t.elan.pj.fait .ring{position:relative;background:var(--sea);border-color:var(--sea)}
.fx-rond.full{position:relative}
.fx-rond.full::after{font-size:15px}
.ring.full::after,.t.elan.fait .ring::after,.fx-rond.full::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:700;line-height:1}
.t.evt.fini .nm{text-decoration:line-through;color:var(--t3)}
.t.evt.fini .heure{opacity:.6}
.t.evt.oui{background:var(--seabg);box-shadow:inset 3px 0 0 var(--sea)}
.t.evt.oui .heure{color:var(--sea);opacity:1}
.t.evt.oui.fini .nm{color:var(--t2)}
.t.evt.non{opacity:.75}
.ech-avance{background:var(--seabg);color:var(--sea);font-weight:500}
.pm{display:inline-flex;align-items:center;gap:2px;background:var(--card);border-radius:12px;padding:1px}
.pm b{font-size:12px;font-weight:600;color:var(--t1);min-width:44px;text-align:center}
.pm-b{border:0;background:transparent;color:var(--moon);width:26px;height:24px;border-radius:10px;font:inherit;font-size:16px;line-height:1;cursor:pointer}
.pm-b:hover{background:var(--moonbg)}
.vars{display:inline-flex;flex-wrap:wrap;gap:5px}
.pm.grand{background:var(--warm);padding:3px}
.pm.grand b{font-size:15px;min-width:64px}
.pm.grand .pm-b{width:34px;height:32px;font-size:19px}
.boucle-g{color:var(--moon);margin-right:8px}
.hist{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  background:transparent;font:inherit;color:var(--t1);padding:8px 4px;cursor:pointer;font-size:13px}
.hist .d{color:var(--moon);font-weight:600;white-space:nowrap;flex-shrink:0}
.hist .n{flex:1;min-width:0}
.hist .n small{display:block;font-size:12px;color:var(--t2);margin-top:2px;white-space:pre-line}
.hist .s{font-size:12px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.var{border:1px solid #e6d9ee;background:var(--card);color:var(--t2);border-radius:12px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.var.on{background:var(--moon);border-color:var(--moon);color:var(--card)}
.moment.cible,.reserve.cible{border-color:var(--sea);border-style:dashed;background:var(--seabg)}
#jour .t{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media(hover:hover){#jour .t:not(.bloq){cursor:grab}}
.t.soulevee{opacity:.3}
.fantome{position:fixed;z-index:30;pointer-events:none;margin:0!important;opacity:.96;
  box-shadow:0 12px 30px rgba(169,112,95,.30);transform:rotate(-1.5deg) scale(1.03)}
body.glisse,body.glisse *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
@media(min-width:760px){
  .jcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto 1fr;
    grid-template-areas:"main rap" "main res";column-gap:16px;align-items:start}
  .jmain{grid-area:main}
  #rappels{grid-area:rap;order:0}
  .reserve{grid-area:res}
  #rappels:empty+.reserve{grid-row:1/3}
  .reserve{position:sticky;top:12px;margin-top:0;max-height:calc(100vh - 24px);overflow-y:auto}
}
.empty{font-size:13px;color:var(--t3);padding:6px 2px}

.cat{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.cat::-webkit-scrollbar{display:none}
.cat button{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--t2);
  font:inherit;font-size:13px;padding:6px 12px;border-radius:14px;cursor:pointer}
.cat button.on{background:var(--ink);color:var(--bg);border-color:transparent}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 9px}
.pt{font-size:13px;color:var(--t3);font-weight:500}

.proj{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:14px 15px;margin-bottom:10px}
.pn{font-size:16px;font-weight:500}
.pd{font-size:13px;color:var(--t2);margin-top:3px}
.bar{height:6px;background:var(--free);border-radius:4px;margin-top:11px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:4px;background:var(--sea)}
.ps{font-size:12px;color:var(--t2);margin-top:6px}

body.copie #d{opacity:.55}
.hint{text-align:center;font-size:12.5px;color:var(--t3);margin-top:14px;min-height:18px}
.add{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  margin-top:20px;display:flex;justify-content:center}
.add button{background:var(--ink);color:var(--bg);border:0;border-radius:26px;
  padding:13px 26px;font:inherit;font-size:15px;cursor:pointer}
.load{text-align:center;color:var(--t2);padding:40px 0;font-size:15px}
.hide{display:none}
.jnav{display:flex;align-items:center;gap:6px}
.jnav .date{width:11.6em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.jnav .date{width:12em;font-size:16.5px}}
.jnav button{border:0;background:var(--card);color:var(--t2);width:30px;height:30px;
  border-radius:15px;font:inherit;font-size:18px;line-height:1;cursor:pointer}

.scrim{position:fixed;inset:0;background:rgba(74,59,54,.22);display:none;z-index:10}
.scrim.on{display:block}
.fiche{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;z-index:12;
  background:var(--card);border-radius:28px 28px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -6px 24px rgba(169,112,95,.18)}
.fiche.on{transform:none}
.fiche:not(.on),.pmodal:not(.on){visibility:hidden}
@media(min-width:760px){
  .fiche{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);max-height:86vh;border-radius:28px;
    padding:18px 22px 20px;transform:translate(-50%,-46%);opacity:0;transition:opacity .18s,transform .18s;
    box-shadow:0 18px 50px rgba(120,80,60,.22)}
  .fiche.on{transform:translate(-50%,-50%);opacity:1}
}
.fx-lien{border:0;background:transparent;color:var(--t2);font:inherit;font-size:13px;cursor:pointer;padding:6px 4px;
  text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.fx-vide{font-size:13px;color:var(--t3);padding:6px 2px}
.fx-projets>.fx-lien{margin-top:6px}
.fiche label{display:block;font-size:12.5px;color:var(--t2);margin:12px 0 4px}

.ch{margin-bottom:14px}
.ch-row{position:relative;padding:0 0 6px 30px}

  background:var(--card);border:2px solid var(--line2);z-index:1}
.ch-row.dispo .dot{border-color:var(--pc);background:var(--pcbg)}

.ch-row.suite::before{content:'';position:absolute;left:10px;top:0;height:14px;border-left:2px solid var(--line2)}

function evtsPrevus(){

function minutesEvtsAVenir(maintenant){

function dureeElan(e,a){
  if(a&&a.minutes)return a.minutes;
  if(a&&a.variante){
    var m=choisies(a).reduce(function(t,nom){var v=(e.variantes||[]).filter(function(x){return x.nom===nom})[0];return t+(v&&v.minutes||0)},0);
    if(m)return m;
  }

}
function choisies(a){return a&&a.variante?a.variante.split(' + '):[]}
var PALIERS=(function(){var p=[5,15,30];for(var m=60;m<=600;m+=30)p.push(m);return p})();
function changerDureeElan(eid,sens,jour){
  jour=jour||jourVu;
  var e=elan(eid),a=avanceeDe(eid,jour);if(!e||!a)return;
  var d=dureeElan(e,a),suiv=null;
  if(sens>0)suiv=PALIERS.filter(function(x){return x>d})[0];
  else suiv=PALIERS.filter(function(x){return x<d}).pop();
  if(!suiv)return;   // ni en dessous de 5 min, ni au-dessus de 10 h
  a.minutes=suiv;rendre();
  google.script.run.withFailureHandler(echecServeur).majAvancee(eid,jour,{minutes:suiv});
}
function choisirVariante(eid,nom,jour){
  jour=jour||jourVu;
  var e=elan(eid),a=avanceeDe(eid,jour);if(!e||!a)return;
  if(e.plusieurs){
    var ch=choisies(a),i=ch.indexOf(nom);
    if(i>=0)ch.splice(i,1);else ch.push(nom);
    a.variante=(e.variantes||[]).map(function(v){return v.nom}).filter(function(n){return ch.indexOf(n)>=0}).join(' + ');
    a.minutes=0;a.minutes=a.variante?dureeElan(e,a):0;
  }
  else if(a.variante===nom){a.variante='';a.minutes=0;}
  else{var v=(e.variantes||[]).filter(function(x){return x.nom===nom})[0];a.variante=nom;a.minutes=v&&v.minutes||0;}
  rendre();
  google.script.run.withFailureHandler(echecServeur).majAvancee(eid,jour,{variante:a.variante,minutes:a.minutes||''});

function h(m){return m>=60?(Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'')):(m+' min')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}
function dateLong(s){return parseIso(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function dateCourte(s){return parseIso(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function dateAff(){document.getElementById('d').textContent=dateLong(jourVu||iso(new Date()))}
function decaler(n){var d=parseIso(jourVu);d.setDate(d.getDate()+n);jourVu=iso(d);rendre()}

var DEBUT=9*60,FIN=23*60,CAPACITE=12*60,MIDI=[12*60,13*60];   // le déjeuner, seul repas retiré du temps libre
function minutesFaites(act){
  var t=act.filter(function(t){return t.moment&&t.jour===jourVu})
    .reduce(function(a,t){return a+(t.statut==='fait'?t.duree:t.duree*(t.avancement||0))},0);
  var e=D.evenements.filter(function(o){var p=participation(o.id,o.jour);return o.jour===jourVu&&p&&p.statut==='oui'})
    .reduce(function(a,o){return a+(o.duree||0)},0);
  var r=D.poses.filter(function(p){var tp=tacheId(p.tache);return p.jour===jourVu&&!p.elements.length&&p.avancement>=1&&estRecurrente(tp)&&!estMulti(tp)&&!(tp.moment&&tp.jour===jourVu)})
    .reduce(function(a,p){return a+(tacheId(p.tache).duree||0)},0);
  return t+e+r;
}
function majBudget(act){
  var hh=function(x){return h(Math.round(x))};
  var tachesRestantes=act.filter(function(t){return t.moment&&t.jour===jourVu&&t.statut!=='fait'})
    .reduce(function(a,t){return a+t.duree*(1-(t.avancement||0))},0)+minutesElans(false)+minutesPoses(false);
  var fait=minutesFaites(act)+minutesElans(true)+minutesPoses(true);
  var prevu=tachesRestantes+evtsPrevus().reduce(function(a,o){return a+o.duree},0);
  var libreJour=Math.max(0,CAPACITE-fait-prevu);

  var haut,lab,sous='';
  if(jourVu===AUJ){
    var now=new Date(),m=now.getHours()*60+now.getMinutes();
    var depart=Math.max(DEBUT,m),avant23=FIN-Math.min(FIN,depart);
    var dejeuner=Math.max(0,MIDI[1]-Math.max(MIDI[0],depart));          // ce qu'il reste du déjeuner
    var dejaPrevu=tachesRestantes+minutesEvtsAVenir(m);
    haut=Math.max(0,avant23-dejeuner-dejaPrevu);
    lab=avant23?'de libre d’ici 23 h':'la journée est finie';
    var dont=[dejeuner?hh(dejeuner)+' de déjeuner':'',dejaPrevu?hh(dejaPrevu)+' déjà prévu':''].filter(Boolean);
    sous=avant23&&dont.length?hh(avant23)+' d’ici 23 h, dont '+dont.join(' et '):'';
  }else if(jourVu<AUJ){
    haut=null;lab='';
  }else{
    haut=libreJour;lab='de libre ce jour-là';
  }
  document.getElementById('bt-tete').style.display=haut===null?'none':'';
  if(haut!==null){
    document.getElementById('bf').textContent=hh(haut);
    document.getElementById('bfl').textContent=lab;
  }
  document.getElementById('bsous').textContent=sous;

  var tot=Math.max(CAPACITE,fait+prevu);
  document.getElementById('gz').innerHTML=
    '<div style="width:'+(fait/tot*100)+'%;background:var(--sea)"></div>'+
    '<div style="width:'+(prevu/tot*100)+'%;background:var(--sun)"></div>';
  document.getElementById('ky').innerHTML=
    '<span><i class="sq" style="background:var(--sea)"></i>fait '+hh(fait)+'</span>'+
    '<span><i class="sq" style="background:var(--sun)"></i>prévu '+hh(prevu)+'</span>'+
    '<span><i class="sq" style="background:var(--free);box-shadow:inset 0 0 0 1px var(--line2)"></i>libre '+hh(libreJour)+'</span>'+
    '<span class="ky-tot">sur 12 h</span>';
  document.getElementById('bcalc').textContent=fait+prevu>CAPACITE?
    'Journée bien remplie : '+hh(fait+prevu)+' entre fait et prévu, pour 12 h.':'';
}

function ligneT(t,o){
  o=o&&typeof o==='object'?o:{};
  if(finieAvant(t))t=Object.assign({},t,{avancement:0,statut:'a faire',moment:'',jour:''},t.mensuel?datesSuivantes(t):{});
  var rec=estRecurrente(t),et=rec?(o.etat||etatRec(t)):null;
  var cls=t.avancement>=1?'ring full':(t.avancement>0?'ring p':'ring');
  var u=urgence(t);
  var autre=t.moment&&t.jour&&t.jour!==jourVu?'<span class="tag">'+dateCourte(t.jour)+'</span>':'';
  if(pasCommencee(t)&&!rec)autre+='<span class="ech ech-loin">dès le '+dateCourte(t.debut)+'</span>';
  if(rec&&t.statut!=='fait')autre+=infoRec(t,et);
  if(estCourses(t)){var pe=[];elementsDe(t).forEach(function(x){var e=!x.fait&&emoProjet(x.projet);if(e&&pe.indexOf(e)<0)pe.push(e)});if(pe.length)autre+='<span class="tag">'+pe.join(' ')+'</span>';}
  if(o.passer)autre+='<button type="button" class="passer" data-passer="'+t.ligne+'" aria-label="Passer pour quelques jours">⏭ Passer</button>';
  var reveil=t.statut==='sommeil'?'<button type="button" class="reveil" data-reveil="'+t.ligne+'">Réveiller</button>':'';
  var dur=t.avancement>0&&t.avancement<1?Math.round(t.avancement*100)+'%':(t.duree?h(t.duree):'');
  var li=elementsDe(t);
  var tog='';
  if(li.length){
    var compte='☰ '+li.filter(function(x){return x.fait}).length+'/'+li.length;
    if(o.liste&&aPoserDe(t).length){
      tog='<button type="button" class="li-tog'+(resListe[t.id]?' on':'')+'" data-lir="'+esc(t.id)+'" aria-expanded="'+(resListe[t.id]?'true':'false')+'" aria-label="'+aPoserDe(t).length+' éléments à poser">'+compte+' '+(resListe[t.id]?'▴':'▾')+'</button>';
      dur=t.duree?h(t.duree):'';
    }else dur=compte+(t.duree?' · '+h(t.duree):'');
  }
  return '<div class="t'+(t.statut==='fait'?' done':'')+(rec?' rec':'')+(et&&et.quand?' rec-tard':'')+(u&&u.niv==='dur'?' urgent':'')+couleurT(t)+'" data-l="'+t.ligne+'"'+(t.occ?' data-occ="'+t.occ+'"':'')+styleT(t)+'>'+
    '<span class="'+cls+'"></span>'+corpsLigne(esc(t.tache),
      (o.sansProjet?'':tagProjet(t))+autre+badge(u)+tog+(dur?'<span class="dur">'+dur+'</span>':'')+reveil)+'</div>';
}

function appliquerChamp(c,v){
  var l=fiche.dataset.l,t=trouve(l),champs={};if(!t)return;
  if(c==='moment'){
    if(finieAvant(t))renouvelerLocal(t);
    if(v){
      garderTrace(t,jourVu);
      t.moment=v;t.jour=jourVu;
      google.script.run.withFailureHandler(echecServeur).setMoment(Number(l),v,jourVu,t.id);
    }else{
      var auto=autoDuJour(t)||(estAuto(t)&&t.moment&&t.jour===jourVu);
      t.moment='';t.jour='';
      google.script.run.withFailureHandler(echecServeur).retirerDuJour(Number(l),t.id);
      if(auto)retirerAuto(t);
    }
    rendre();ouvrirFiche(l);return;
  }
  if(c==='avancement'){
    var ancienA=t.avancement;
    t.avancement=Number(v)/100;
    if(t.statut!=='sommeil')t.statut=t.avancement>=1?'fait':(t.avancement>0?'en cours':'a faire');
    champs={avancement:t.avancement,statut:t.statut};
    suivreAvancement(t,ancienA);
  }else if(c==='statut'){
    var ancienS=t.avancement;
    t.statut=v;
    if(v==='fait')t.avancement=1;
    if(v==='a faire')t.avancement=0;
    champs={statut:v,avancement:t.avancement};
    suivreAvancement(t,ancienS);
  }else if(c==='duree_min'){
    t.duree=Number(v)||0;champs.duree_min=t.duree;
  }else if(c==='visible_a_partir_de'){
    t.rampe=v;champs[c]=v;
  }else{
    if(c==='tache'&&!String(v).trim())return;   // un nom vide n'est pas enregistré
    t[c]=v;champs[c]=v;
  }
  if(c==='avancement'||c==='statut'){if(t.statut==='fait')t.fait_le=t.jour||t.fait_le||AUJ;else if(t.statut!=='sommeil')t.fait_le='';}
  rendre();
  envoyer(l,champs);
  if(['statut','echeance','projet','apres','avancement','debut','souhaitee','type','nature','pose_auto'].indexOf(c)>=0)ouvrirFiche(l);
}

  else nouvelle.sorte=sorte;

  fiche.dataset.l='';fiche.dataset.mode='nouvelle';
  fiche.innerHTML='<div class="fx">'+
    pastilles('data-nv','sorte',[['tache','Une tâche'],['rappel','📌 Un rappel'],['idee','💡 Une idée']],nouvelle.sorte)+
    '<textarea class="fx-titre" id="nv-titre" rows="1" placeholder="'+(rap?'De quoi veux-tu te souvenir ?':(ide?'Quelle idée veux-tu garder pour plus tard ?':'Qu’est-ce que tu veux noter ?'))+'">'+esc(texte)+'</textarea>'+
    '<div class="fx-err" id="nv-err"></div>'+
    (ide?'<div class="fx-cap">pas de date, rien à poser : elle t’attend dans son projet</div><div class="fx-lab">Projet</div>'+blocProjet('nouvelle'):
    rap?
      '<div class="fx-lab">Quel jour ?</div>'+pastilles('data-nv','jour',[['','Pas de date'],[jourVu,jourVu===AUJ?'Aujourd’hui':dateCourte(jourVu)],
        [lendemain,lendemain===jourPlus(AUJ,1)?'Demain':dateCourte(lendemain)]],nouvelle.jour)+
      '<div class="fx-cap">'+(nouvelle.jour?'affiché seulement ce jour-là · d’autres dates dans sa fiche':'affiché chaque jour, jusqu’à ce que tu le ranges')+'</div>'+
      '<div class="fx-lab">Projet</div>'+blocProjet('nouvelle'):
      '<div class="fx-lab">Quand ?</div>'+pastilles('data-nv','moment',choixMoments('Plus tard'),nouvelle.moment)+
      '<div class="fx-cap">pour '+nomJourVu()+'</div>'+
      '<div class="fx-lab">Projet</div>'+blocProjet('nouvelle')+
      '<div class="fx-lab">Durée</div>'+pastilles('data-nv','duree',[['','—'],['15','15 min'],['30','30 min'],['60','1 h'],['120','2 h']],nouvelle.duree))+

    '<button type="button" class="pri" data-fx="ajouter">Ajouter</button></div></div>';
  fiche.classList.add('on');scrim.classList.add('on');
  setTimeout(function(){var x=document.getElementById('nv-titre');if(x){x.focus();ajusterHauteur(x);}},60);
}
function ajouterNouvelle(){
  var x=document.getElementById('nv-titre'),titre=x.value.trim();
  if(!titre){document.getElementById('nv-err').textContent='Écris d’abord ce que tu veux noter.';x.focus();return;}
  if(nouvelle.sorte==='idee'){
    fermerFiche();
    ajouterIdeeLocale(titre,nouvelle.projet);
    return;
  }
  if(nouvelle.sorte==='rappel'){
    var jours=nouvelle.jour?[nouvelle.jour]:[],r={id:'',texte:titre,projet:nouvelle.projet,jours:jours,statut:'actif',note:'',vus:[]};
    D.rappels.push(r);
    fermerFiche();
    document.getElementById('hint').textContent='Rappel « '+titre+' » ajouté.';
    google.script.run.withSuccessHandler(function(id){r.id=id;rendre();}).withFailureHandler(echecServeur)
      .ajouterRappel(titre,{projet:nouvelle.projet,jours:jours});
    return;
  }
  var champs={projet:nouvelle.projet,moment:nouvelle.moment,jour:nouvelle.moment?jourVu:'',duree_min:Number(nouvelle.duree)||''};
  fermerFiche();
  document.getElementById('hint').textContent='« '+titre+' » ajoutée.';
  google.script.run.withSuccessHandler(charger).withFailureHandler(echecServeur).ajouterTache(titre,champs);
}

var achLieu={},achNvLieu='',achOuvert={},achDejaOuvert=false;

        '<button type="button" class="fx-lien" data-ach-autre="'+esc(pid)+'">＋ Autre lieu</button>')+'</div>'+
    (d.length?'<details class="li-deja" id="achdeja"'+(achDejaOuvert?' open':'')+'><summary>✓ Déjà acheté ('+d.length+')</summary>'+d.map(function(x){
      var t=tacheId(x.tache),j=jourAchat(x);

var confirmeIdee=null,ideesOuvert=false,ideesLibresOuvert=false;
function idee(id){return D.idees.filter(function(i){return i.id===id})[0]}
function ideesProjet(pid){return D.idees.filter(function(i){return i.projet===pid})}
function ligneIdee(i){
  var sur=confirmeIdee===i.id;
  return '<div class="idee" data-idee="'+esc(i.id)+'"><span class="idee-ic">💡</span>'+
    '<div class="idee-c"><div class="idee-x">'+esc(i.texte)+'</div>'+(i.note?'<small>'+esc(i.note)+'</small>':'')+'</div>'+
    '<button type="button" class="idee-b" data-idee-tache>→ Tâche</button>'+
    '<button type="button" class="idee-b idee-sup'+(sur?' sur':'')+'" data-idee-sup aria-label="Supprimer l’idée">'+(sur?'Supprimer ?':'✕')+'</button></div>';

function sectionIdees(pid){

function rafraichirIdees(){
  if(pmodal.classList.contains('on'))renderPModal();
  renderProjets();
}
function ajouterIdeeLocale(texte,pid){
  texte=String(texte).trim();if(!texte)return;
  var i={id:'',texte:texte,projet:pid||'',note:'',creee:AUJ};
  D.idees.push(i);
  document.getElementById('hint').textContent='Idée gardée : « '+texte+' ».';
  rafraichirIdees();
  google.script.run.withSuccessHandler(function(id){i.id=id}).withFailureHandler(echecServeur).ajouterIdee(texte,{projet:pid||''});
}
document.addEventListener('click',function(e){
  var row=e.target.closest('[data-idee]');
  if(!row){if(confirmeIdee){confirmeIdee=null;rafraichirIdees();}return;}
  var i=idee(row.dataset.idee);if(!i||!i.id)return;
  if(e.target.closest('[data-idee-tache]')){
    D.idees=D.idees.filter(function(x){return x!==i});confirmeIdee=null;rafraichirIdees();
    document.getElementById('hint').textContent='Idée devenue tâche : « '+i.texte+' » (dans « À poser »).';
    google.script.run.withSuccessHandler(charger).withFailureHandler(echecServeur).ideeEnTache(i.id);
    return;
  }
  if(e.target.closest('[data-idee-sup]')){
    if(confirmeIdee!==i.id){confirmeIdee=i.id;rafraichirIdees();return;}   // un second toucher confirme
    D.idees=D.idees.filter(function(x){return x!==i});confirmeIdee=null;rafraichirIdees();
    document.getElementById('hint').textContent='Idée supprimée.';
    google.script.run.withFailureHandler(echecServeur).supprimerIdee(i.id);
  }
});
document.addEventListener('keydown',function(e){
  var inp=e.target.closest&&e.target.closest('[data-idee-nv]');
  if(inp&&e.key==='Enter'&&!e.isComposing){e.preventDefault();ajouterIdeeLocale(inp.value,inp.dataset.ideeNv);}

function rappelFini(r,j){return !!r.fin&&(j||AUJ)>r.fin}
function rappelsProjet(pid){
  return D.rappels.filter(function(r){
    if(r.projet!==pid||r.statut==='fait'||rappelFini(r))return false;
    return !r.jours.length||r.jours.some(function(j){return j>=AUJ&&r.vus.indexOf(j)<0});
  }).sort(function(a,b){return (rappelPlusTard(a)?1:0)-(rappelPlusTard(b)?1:0)});   // ceux d'aujourd'hui d'abord
}
function sectionRappels(pid){
  var rs=rappelsProjet(pid),ranges=D.rappels.filter(function(r){return r.projet===pid&&rs.indexOf(r)<0});
  if(!rs.length&&!ranges.length)return '';
  return '<div class="psec">📌 À te rappeler'+(rs.length?' ('+rs.length+')':'')+'</div>'+
    (rs.length?'<div class="rappels rap-proj">'+rs.map(function(r){return ligneRappel(r,{sansProjet:true})}).join('')+'</div>':'')+
    (ranges.length?'<details class="pdone rap-ranges"><summary>Rangés ('+ranges.length+')</summary><div class="rappels rap-proj">'+
      ranges.map(function(r){return ligneRappel(r,{sansProjet:true,sansBouton:true})}).join('')+'</div></details>':'');
}
function jourPlus(j,n){var d=parseIso(j);d.setDate(d.getDate()+n);return iso(d)}
function rappel(id){return D.rappels.filter(function(r){return r.id===id})[0]}
function rappelsDuJour(j){
  return D.rappels.filter(function(r){
    if(r.statut==='fait'||rappelFini(r,j))return false;
    return r.jours.length?r.jours.indexOf(j)>=0&&r.vus.indexOf(j)<0:!rappelPlusTard(r,j);
  }).sort(function(a,b){return (b.jours.length?1:0)-(a.jours.length?1:0)});
}
function rappelPlusTard(r,j){return !r.jours.length&&!!r.debut&&r.debut>(j||AUJ)}
function infoJours(r){
  if(!r.jours.length)return (rappelPlusTard(r,AUJ)?'dès le '+dateCourte(r.debut):'sans date')+(r.fin?' · jusqu’au '+dateCourte(r.fin):'');
  var futurs=r.jours.filter(function(j){return j>=AUJ});
  return r.jours.length>1?r.jours.length+' dates'+(futurs.length?' · prochaine '+dateCourte(futurs[0]):''):dateCourte(r.jours[0]);
}
function ligneRappel(r,o){
  o=o||{};
  return '<div class="rap" data-rap="'+esc(r.id)+'"><div class="rap-c" data-rap-ouvre>'+
    '<div class="rap-x">'+avecEmoji(esc(r.texte))+'</div>'+
    '<div class="rap-i">'+(o.sansProjet?'':tagProjet({projet:r.projet}))+'<span class="rap-d">'+(r.jours.indexOf(jourVu)>=0&&!o.sansProjet?'aujourd’hui':infoJours(r))+'</span></div>'+
    '</div>'+(o.sansBouton?'':'<button type="button" class="rap-ok" data-rap-ok title="Je m’en souviens, le ranger">✓</button>')+'</div>';
}
function renderRappels(){
  var rs=rappelsDuJour(jourVu),el=document.getElementById('rappels');
  var tard=D.rappels.filter(function(r){return r.statut!=='fait'&&!rappelFini(r,jourVu)&&rappelPlusTard(r,jourVu)})
    .sort(function(a,b){return a.debut.localeCompare(b.debut)});
  el.innerHTML=rs.length||tard.length?'<div class="rappels"><div class="rap-t">📌 À te rappeler <span>'+rs.length+'</span></div>'+
    rs.map(function(r){return ligneRappel(r)}).join('')+
    (tard.length?'<details class="rap-tard" id="raptard"'+(rapTardOuvert?' open':'')+'><summary>⏳ Plus tard ('+tard.length+')</summary>'+
      tard.map(function(r){return ligneRappel(r,{sansBouton:true})}).join('')+'</details>':'')+'</div>':'';
}
var rapTardOuvert=false;
document.addEventListener('click',function(e){if(e.target.closest('#raptard > summary'))rapTardOuvert=!rapTardOuvert;});
function rangerRappel(id,jour,tout){
  var r=rappel(id);if(!r||!r.id)return;
  if(r.jours.length&&!tout){r.vus=r.vus.concat([jour]);majRappelServeur(r,{vus:r.vus});}
  else{r.statut='fait';majRappelServeur(r,{statut:'fait'});}
  document.getElementById('hint').textContent='Rappel rangé : « '+r.texte+' ».';
  rendre();if(pmodal.classList.contains('on'))renderPModal();
}
function majRappelServeur(r,champs){google.script.run.withFailureHandler(echecServeur).majRappel(r.id,champs);}
document.addEventListener('click',function(e){
  var row=e.target.closest('.rap[data-rap]');if(!row||fiche.contains(row))return;
  if(e.target.closest('[data-rap-ok]')){rangerRappel(row.dataset.rap,jourVu,pmodal.contains(row));return;}
  if(e.target.closest('[data-rap-ouvre]'))ouvrirRappel(row.dataset.rap);
});

      '<div class="fx-cap">'+(r.debut?'caché jusqu’au '+dateLong(r.debut)+' (efface la date pour l’afficher dès maintenant)':'vide : affiché dès maintenant')+'</div>'+
      '<div class="fx-lab">Jusqu’au</div><input type="date" class="fx-date" data-rapfin value="'+esc(r.fin||'')+'" aria-label="Jusqu’au">'+

function changerRappel(r,champs){
  Object.keys(champs).forEach(function(k){r[k==='rappel'?'texte':k]=champs[k]});
  majRappelServeur(r,champs);rendre();if(pmodal.classList.contains('on'))renderPModal();ouvrirRappel(r.id);
}
fiche.addEventListener('click',function(e){
  if(fiche.dataset.mode!=='rappel')return;
  var r=rappel(fiche.dataset.rap);if(!r)return;
  var c=e.target.closest('[data-rapc]');
  if(c){projetsOuverts=false;changerRappel(r,{projet:c.dataset.v});return;}
  var x=e.target.closest('[data-rapx]');
  if(x){changerRappel(r,{jours:r.jours.filter(function(j){return j!==x.dataset.rapx})});return;}
  var j=e.target.closest('[data-rapj]');

function trouveId(id){return D.taches.filter(function(t){return t.id===id})[0]}
function precedente(t){return t.apres?trouveId(t.apres):null}
function bloquee(t){
  if(estRecurrente(t))return false;   // leur « après » se lit autrement (etatRec)
  var pre=precedente(t);
  if(!pre||pre.statut==='sommeil'||pre.statut==='fait')return false;
  var c=pre,n=0;
  while(c&&c.apres&&n<D.taches.length){
    if(c.apres===t.id)return false;
    c=trouveId(c.apres);n++;
  }
  return true;
}
function faisable(t){return t.statut!=='fait'&&t.statut!=='sommeil'&&!bloquee(t)&&!pasCommencee(t)&&!(estCourses(t)&&!elementsDe(t).some(function(x){return !x.fait}))}
function pasCommencee(t,j){j=j||jourVu||AUJ;return !!(t.debut&&j&&t.debut>j)}
function tachesProjet(pid){return D.taches.filter(function(t){return t.projet===pid})}
function estRecurrente(t){return !!t&&(t.nature==='recurrente-souple'||t.tous_les>0||!!t.mensuel)}
function moisPlus(j,n){
  var a=+j.slice(0,4),m=+j.slice(5,7)-1+n,d=+j.slice(8,10);
  a+=Math.floor(m/12);m=((m%12)+12)%12;
  var fin=new Date(a,m+1,0).getDate();
  return a+'-'+String(m+1).padStart(2,'0')+'-'+String(Math.min(d,fin)).padStart(2,'0');
}
function datesSuivantes(t){
  var le=t.fait_le||t.jour,ref=t.debut||t.echeance||t.souhaitee,r={};if(!le||!ref)return r;
  var n=0;while(moisPlus(ref,n)<=le&&n<600)n++;
  n=Math.max(n,1);   // faite en avance (avant le début) : c'est la fois en cours, la suivante est le mois d'après
  ['debut','souhaitee','echeance','rampe'].forEach(function(k){if(t[k])r[k]=moisPlus(t[k],n)});
  return r;
}
function tachesSuivies(pid){return tachesProjet(pid).filter(function(t){return !estRecurrente(t)})}
function precRec(t){var p=t.apres?trouveId(t.apres):null;return p&&p!==t&&estRecurrente(p)?p:null}
function derniereRec(t){
  if(estMulti(t)){var f=derniereFoisMulti(t);return f?f.jour:(t.derniere||'')}
  return (t.statut==='fait'?(t.fait_le||t.jour):'')||t.derniere||'';
}
function finieAvant(t,j){j=j||jourVu;var d=derniereRec(t);return estRecurrente(t)&&!estMulti(t)&&t.statut==='fait'&&!!d&&d<j}
var CHAQUE_MOMENT={journee:'chaque jour',matin:'chaque matin','apres-midi':'chaque après-midi',soir:'chaque soir'};
var NOM_MOMENT={journee:'dans la journée',matin:'matin','apres-midi':'après-midi',soir:'soir'};
function rythmeRec(t){
  var p=precRec(t);if(p)return 'après « '+sansEmoji(p.tache)+' »';
  if(t.mensuel){var dm=t.debut?+t.debut.slice(8,10):0;return 'chaque mois'+(dm?', dès le '+(dm===1?'1er':dm):'');}
  var n=t.tous_les||1;
  if(estMulti(t)){var ms=momentsAuto(t).map(function(m){return NOM_MOMENT[m]}).join(' et ');return n===1?ms:'tous les '+n+' jours, '+ms;}
  return n===1?(CHAQUE_MOMENT[t.pose_auto]||'chaque jour'):'tous les '+n+' jours'+(t.pose_auto&&t.pose_auto!=='journee'?', le '+t.pose_auto.replace('apres-midi','après-midi'):'');
}
function estAuto(t){return estRecurrente(t)&&!!t.pose_auto}
function autoDuJour(t,j){j=j||jourVu;return estAuto(t)&&!estMulti(t)&&j>=AUJ&&t.statut!=='sommeil'&&!enPause(t.projet)&&!(t.moment&&t.jour===j)&&!!etatRec(t,j).due}
function vueAuto(t){
  if(!autoDuJour(t))return t;
  return Object.assign({},t,{moment:t.pose_auto,jour:jourVu,avancement:0,statut:'a faire',fait_le:'',auto:true});
}
function retirerAuto(t){t.pause=jourPlus(jourVu,1);envoyer(t.ligne,{pause_jusqu_au:t.pause});}
var ORDRE_MOM={journee:0,matin:1,'apres-midi':2,soir:3},HEURE_MOM={matin:'09:00','apres-midi':'14:00',soir:'20:00'};
function momentsAuto(t){
  return String(t.pose_auto||'').split(',').map(function(x){return x.trim()}).filter(function(x,i,a){return ORDRE_MOM[x]!=null&&a.indexOf(x)===i})
    .sort(function(a,b){return ORDRE_MOM[a]-ORDRE_MOM[b]});
}
function estMulti(t){return estRecurrente(t)&&momentsAuto(t).length>1}
function foisDe(t){return D.poses.filter(function(p){return p.tache===t.id&&!p.elements.length&&p.avancement>=1})}
function foisFaite(t,j,m){return foisDe(t).filter(function(p){return p.jour===j&&p.moment===m})[0]}
function derniereFoisMulti(t,jusqua){
  var fs=foisDe(t).filter(function(p){return !jusqua||p.jour<=jusqua})
    .sort(function(a,b){return a.jour.localeCompare(b.jour)||(ORDRE_MOM[a.moment]||0)-(ORDRE_MOM[b.moment]||0)});
  return fs[fs.length-1]||null;
}
function derniereAvantMulti(t,j){
  var d=t.derniere||'';
  foisDe(t).forEach(function(p){if(p.jour<j&&p.jour>d)d=p.jour});
  return d;
}
function quandFois(f,j){
  var n=ecartJours(f.jour,j||jourVu);
  if(n===0)return {matin:'ce matin','apres-midi':'cet après-midi',soir:'ce soir'}[f.moment]||"aujourd'hui";
  if(n===1)return 'hier'+({matin:' matin','apres-midi':' après-midi',soir:' soir'}[f.moment]||'');
  return n<0?'le '+dateCourte(f.jour):'il y a '+n+' jours';
}
function foisDuJour(t,j){
  j=j||jourVu;
  var due=j>=AUJ&&t.statut!=='sommeil'&&!enPause(t.projet)&&!!etatRec(t,j).due;
  return momentsAuto(t).map(function(m){
    var f=foisFaite(t,j,m);
    if(!f&&!due)return null;
    return Object.assign({},t,{moment:m,jour:j,occ:m,statut:f?'fait':'a faire',avancement:f?1:0,fait_le:f?j:''});
  }).filter(Boolean);
}
function basculerFois(t,j,m){
  var ms=momentsAuto(t);
  if(!m){var mc=j===AUJ?momentCourant():'';m=ms.indexOf(mc)>=0&&!foisFaite(t,j,mc)?mc:(ms.filter(function(x){return !foisFaite(t,j,x)})[0]||ms[ms.length-1]);}
  var f=foisFaite(t,j,m);
  if(f)supprimerPoseLocale(f);
  else{
    ajouterPoseLocale({tache:t.id,jour:j,moment:m,elements:[],avancement:1});
    if(t.pause){t.pause='';envoyer(t.ligne,{pause_jusqu_au:''});}
  }
  rendre();
}
function ecartJours(a,b){return Math.round((parseIso(b)-parseIso(a))/86400000)}
function ilYaRec(d,j){var n=ecartJours(d,j||jourVu);return n<=0?"aujourd'hui":(n===1?'hier':'il y a '+n+' jours')}
function revientRec(q,j){var n=ecartJours(j||jourVu,q);return n<=1?'revient demain':(n<7?'revient dans '+n+' jours':'revient le '+dateCourte(q))}
function etatRec(t,j){
  j=j||jourVu;
  if(t.statut==='sommeil')return {dort:true};
  var multi=estMulti(t);
  if(!multi&&t.statut==='fait'&&!finieAvant(t,j))return {fait:true};
  var der=multi?derniereAvantMulti(t,j):derniereRec(t);
  if(t.pause&&t.pause>j)return {quand:t.pause,txt:'passée · revient le '+dateCourte(t.pause),passee:true};
  if(t.mensuel){
    var dt=finieAvant(t,j)?Object.assign({},t,datesSuivantes(t)):t;
    return pasCommencee(dt,j)?{quand:dt.debut,txt:'revient le '+dateCourte(dt.debut)}:{due:true};
  }
  if(pasCommencee(t,j))return {quand:t.debut,txt:'dès le '+dateCourte(t.debut)};
  var p=precRec(t);
  if(p){
    var dp=derniereRec(p);
    if(dp&&dp<=j&&(!der||dp>der))return {due:true};
    return {quand:'9999',txt:'après « '+sansEmoji(p.tache)+' »'};
  }
  if(!der)return {due:true};
  var q=jourPlus(der,t.tous_les||1);
  return q<=j?{due:true}:{quand:q,txt:revientRec(q,j)};
}
function infoRec(t,et){
  var der=finieAvant(t)||t.statut!=='fait'?derniereRec(t):t.derniere;
  var dern=der?'dernière fois '+ilYaRec(der):'pas encore faite';
  if(estMulti(t)){var f=derniereFoisMulti(t,jourVu);if(f)dern='dernière fois '+quandFois(f);}
  return '<span class="rec">🔁 '+(et&&et.txt?esc(et.txt):esc(rythmeRec(t)))+'</span><span class="derniere">'+dern+'</span>';
}
function renouvelerLocal(t){

function corpsChemin(ts,o){
  o=o||{};
  var parId={};ts.forEach(function(t){parId[t.id]=t});
  var enfants=function(n){return ts.filter(function(t){return t!==n&&t.apres===n.id})};
  var estRacine=function(t){var pre=t.apres&&parId[t.apres];return !pre||pre===t};
  var vus={};
  function sousArbre(t,acc){acc=acc||{};if(acc[t.id])return acc;acc[t.id]=t;enfants(t).forEach(function(k){sousArbre(k,acc)});return acc;}
  var nFinis=0;
  if(!o.garderFaites)ts.filter(estRacine).forEach(function(r){
    var sub=sousArbre(r),l=Object.keys(sub).map(function(k){return sub[k]});
    if(l.every(function(t){return t.statut==='fait'})){l.forEach(function(t){vus[t.id]=true});nFinis+=l.length;}
  });

  function rangee(t,lien,aSuite){
    var etat=t.statut==='fait'?'fait':(bloquee(t)?'bloque':(pasCommencee(t,AUJ)?'plustard':(t.statut==='en cours'?'encours':'dispo')));
    return '<div class="ch-row '+etat+(lien?' '+lien:'')+(aSuite?' avant':'')+'"><span class="dot"></span>'+
      (etat==='bloque'?ligneBloq(t,true):ligneT(t,{sansProjet:true}))+'</div>';
  }
  function suite(t,lien){
    var html='',cur=t;
    while(cur&&!vus[cur.id]){
      vus[cur.id]=true;
      var ks=enfants(cur).filter(function(k){return !vus[k.id]});
      html+=(o.rangee||rangee)(cur,lien,ks.length>0);
      lien='suite';
      if(ks.length===1){cur=ks[0];continue;}
      if(ks.length>1)html+='<div class="ch-brs">'+ks.map(function(k){return '<div class="ch-br">'+suite(k,'branche')+'</div>'}).join('')+'</div>';
      cur=null;
    }
    return html;
  }

  var corps='';
  ts.filter(estRacine).forEach(function(t){if(!vus[t.id])corps+='<div class="ch">'+suite(t,'')+'</div>'});
  ts.forEach(function(t){if(!vus[t.id])corps+='<div class="ch">'+suite(t,'')+'</div>'});

  return corps||(nFinis?'<div class="empty">Tout est fait ✓ (voir l’historique)</div>':'<div class="empty">rien ici pour l\'instant</div>');
}

function elanVisionner(){return D.elans.filter(function(e){return e.lien==='medias'})[0]}
function visionneDe(mid,jour){return D.visionnages.filter(function(v){return v.media===mid&&v.jour===jour})[0]}
function tousMedias(){return D.films.concat(D.series)}
function mediaParId(mid){return tousMedias().filter(function(m){return m.id===mid})[0]}
function derniereVision(jusqua){
  var js=D.visionnages.map(function(v){return v.jour}).filter(function(j){return !jusqua||j<=jusqua}).sort();
  return js[js.length-1]||'';
}
function vusDuJour(){
  var ms=D.visionnages.filter(function(v){return v.jour===jourVu}).map(function(v){return mediaParId(v.media)}).filter(Boolean);

  }).join('')+'</div>':'';

function decocherVoirSiVide(jour){
  var el=elanVisionner(),a=el&&avanceeDe(el.id,jour);
  if(a&&a.fait&&!D.visionnages.some(function(v){return v.jour===jour})){
    a.fait=false;
    google.script.run.withFailureHandler(echecServeur).majAvancee(el.id,jour,{fait:false});
  }
}
function recalculerFilm(mid){
  var m=mediaParId(mid);if(!m||m.type!=='film')return;
  var ss=sessionsMedia(mid),ch={};
  if(!ss.length){
    if((m.statut==='vu'||m.statut==='en cours')&&(m.fin===jourVu||m.debut===jourVu)){ch.statut='à voir';ch.fin='';ch.debut='';}
  }else{
    var der=ss[ss.length-1];
    if(der.pourcent>=100){ch.statut='vu';ch.fin=der.jour;}
    else{ch.statut='en cours';ch.fin='';}
    if(!m.debut||m.debut>ss[0].jour)ch.debut=ss[0].jour;
  }
  Object.keys(ch).forEach(function(k){if(m[k]===ch[k])delete ch[k]});
  if(Object.keys(ch).length)majMediaLocal('film',mid,ch);
}
function noterSession(mid,champs){
  var m=mediaParId(mid);if(!m)return;
  var s=visionneDe(mid,jourVu);
  if(!s){s={jour:jourVu,media:mid,pourcent:0,note:''};D.visionnages.push(s);}
  Object.keys(champs).forEach(function(k){s[k]=champs[k]});
  google.script.run.withFailureHandler(echecServeur).enregistrerVisionnage(mid,jourVu,champs);
  if(m.type==='film')recalculerFilm(mid);
  else{
    var ch={};
    if(m.statut==='à voir'||m.statut==='en pause')ch.statut='en cours';
    if(!m.debut)ch.debut=jourVu;
    if(Object.keys(ch).length)majMediaLocal('serie',mid,ch);
  }
  var el=elanVisionner();
  if(el){var a=avanceeDe(el.id,jourVu);if(!a||!a.fait)basculerElan(el.id);}
}
function basculerVisionnage(mid){
  var m=mediaParId(mid);if(!m)return;
  if(visionneDe(mid,jourVu)){
    D.visionnages=D.visionnages.filter(function(v){return !(v.media===mid&&v.jour===jourVu)});
    google.script.run.withFailureHandler(echecServeur).retirerVisionnage(mid,jourVu);
    recalculerFilm(mid);
    var dj=epsDuJour(mid,jourVu);if(dj.length)retirerEps(mid,dj.map(function(e){return {saison:e.saison,episode:e.episode}}));
    decocherVoirSiVide(jourVu);
  }else{
    noterSession(mid,{pourcent:m.type==='film'?100:0});
    if(m.type==='serie'){var nx=suivantEp(m);if(nx)marquerEps(mid,[nx],jourVu);}

}

var lvN=0,lvT=null,lvResultats=[];
function chercherLecture(q){
  clearTimeout(lvT);
  var res=document.getElementById('lv-res'),liste=document.getElementById('lv-liste');if(!res)return;
  q=q.trim();
  if(q.length<2){res.innerHTML='';if(liste)liste.style.display='';return;}
  if(liste)liste.style.display='none';
  var nq=normTitre(q);
  var locaux=D.livres.filter(function(l){return normTitre(l.titre+' '+l.auteur).indexOf(nq)>=0}).slice(0,12);
  res.innerHTML=(locaux.length?'<div class="fx-lab">Dans ta bibliothèque</div><div class="etagere choix">'+locaux.map(tuileChoix).join('')+'</div>':'')+
    '<div id="lv-web" class="fx-cap">Je cherche en ligne…</div>';
  var n=++lvN;
  lvT=setTimeout(function(){
    var zone=function(){return n===lvN?document.getElementById('lv-web'):null};
    google.script.run.withSuccessHandler(function(rs){
      var z=zone();if(!z)return;
      lvResultats=rs.filter(function(r){return !D.livres.some(function(l){return normTitre(l.titre)===normTitre(r.titre)})});
      z.outerHTML=lvResultats.length?'<div id="lv-web"><div class="fx-lab">Ajouter à ta bibliothèque</div><div class="sugg">'+lvResultats.map(function(r,i){
        return '<button type="button" class="sugg-l" data-lv-add="'+i+'"><span class="sugg-i">'+(r.couverture?'<img src="'+esc(r.couverture)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</span>'+
          '<span class="sugg-t">'+esc(r.titre)+'<small>'+esc([r.auteur,r.annee].filter(Boolean).join(' · '))+'</small></span><span class="vs-plus">＋</span></button>';
      }).join('')+'</div></div>':'<div id="lv-web" class="fx-cap">'+(locaux.length?'Rien d’autre en ligne.':'Rien trouvé.')+'</div>';
    }).withFailureHandler(function(e){
      var z=zone();if(z)z.outerHTML='<div id="lv-web" class="fx-cap">'+esc(e.message||'Recherche en ligne indisponible')+'</div>';
    }).chercherLivres(q);
  },450);
}

          D.livres.push({id:x.id,titre:r.titre,auteur:r.auteur,statut:'en cours',pages:r.pages||0,page:0,pourcent:0,debut:jourVu,fin:'',note:'',
            courant:false,projets:pr,couverture:x.couverture||r.couverture||'',annee:r.annee||''});

      if(st.dataset.v==='en cours'&&!l.debut)ch.debut=jourVu;
      majLivreLocal(id,ch);rendre();ouvrirLivre(id);return;
    }
    var pj=e.target.closest('[data-lvp]');
    if(pj){
      var ps=(l.projets||[]).slice(),k=ps.indexOf(pj.dataset.lvp);
      if(k>=0)ps.splice(k,1);else ps.push(pj.dataset.lvp);
      majLivreLocal(id,{projets:ps.join(', ')});rendre();ouvrirLivre(id);return;
    }
  }
  var b=e.target.closest('[data-lv]');if(!b)return;
  var act=b.dataset.lv;
  if(act==='vers-biblio'){fermerFiche();document.querySelector('.tabs [data-v=biblio]').click();return;}
  if(act==='creer'){creerLivre(b);return;}
  if(mode!=='livre'||!l)return;
  if(act==='session'){basculerLecture(id);ouvrirLivre(id);}
  if(act==='suppr-session'){
    var j=b.dataset.jour;
    D.lectures=D.lectures.filter(function(x){return !(x.livre===id&&x.jour===j)});
    google.script.run.withFailureHandler(echecServeur).retirerLecture(id,j);
    decocherLireSiVide(j);rendre();ouvrirLivre(id);
  }
  if(act==='couverture'){
    b.disabled=true;b.textContent='Je cherche…';
    google.script.run.withFailureHandler(echecServeur).withSuccessHandler(function(c){
      if(c){l.couverture=c;rendre();ouvrirLivre(id);}
      else{b.disabled=false;b.textContent='Chercher une couverture';document.getElementById('lv-err').textContent='Pas de couverture trouvée pour ce titre.';}
    }).trouverCouverture(id);
  }
  if(act==='supprimer'){
    if(confirmeLivre!==id){
      confirmeLivre=id;b.textContent='Vraiment retirer ?';b.classList.add('confirme');
      setTimeout(function(){if(confirmeLivre===id&&b.isConnected){confirmeLivre=null;b.textContent='Retirer de la bibliothèque';b.classList.remove('confirme');}},4000);
      return;
    }
    D.livres=D.livres.filter(function(x){return x.id!==id});
    D.lectures=D.lectures.filter(function(x){return x.livre!==id});
    google.script.run.withFailureHandler(echecServeur).supprimerLivre(id);
    fermerFiche();
    document.getElementById('hint').textContent='« '+l.titre+' » retiré de la bibliothèque.';
  }
});

var glisse=null,apresGlisse=false;
function zoneSous(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest('#jour .moment,#reserve')}
function demarrerGlisse(x,y){
  var r=glisse.row.getBoundingClientRect(),g=glisse.row.cloneNode(true);
  g.classList.add('fantome');
  g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  document.body.appendChild(g);
  glisse.ghost=g;glisse.actif=true;glisse.dx=x-r.left;glisse.dy=y-r.top;glisse.x=x;glisse.y=y;
  glisse.row.classList.add('soulevee');document.body.classList.add('glisse');
  if(glisse.touch&&navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
  requestAnimationFrame(defilerBords);
}
function bougerGlisse(x,y){
  glisse.x=x;glisse.y=y;
  glisse.ghost.style.left=(x-glisse.dx)+'px';glisse.ghost.style.top=(y-glisse.dy)+'px';
  var z=zoneSous(x,y);
  if(z!==glisse.zone){
    if(glisse.zone)glisse.zone.classList.remove('cible');
    glisse.zone=z;if(z)z.classList.add('cible');
  }
}
function defilerBords(){
  if(!glisse||!glisse.actif)return;
  var v=glisse.y<70?-14:(glisse.y>innerHeight-70?14:0);
  if(v){window.scrollBy(0,v);bougerGlisse(glisse.x,glisse.y);}
  requestAnimationFrame(defilerBords);
}
function reordonner(z,g){
  var rows=[].filter.call(z.querySelectorAll('.t:not(.evt)'),function(r){return r!==g.row&&!r.closest('details.termines')});
  var cle=g.e?'e:'+g.e:'t:'+g.l,idx=rows.filter(function(r){var b=r.getBoundingClientRect();return b.top+b.height/2<g.y}).length;
  var cles=rows.map(function(r){return r.dataset.e?'e:'+r.dataset.e:'t:'+r.dataset.l});
  cles.splice(idx,0,cle);
  var envoi=[];
  cles.forEach(function(k,i){
    if(k[0]==='e'){var a=avanceeDe(k.slice(2),jourVu);if(a){a.ordre=i+1;envoi.push({elan:a.elan,ordre:i+1});}}
    else{var t=trouve(k.slice(2));if(t){t.ordre=i+1;envoi.push({tache:t.id,ligne:Number(t.ligne),ordre:i+1});}}
  });
  google.script.run.withFailureHandler(echecServeur).ordonnerJour(jourVu,envoi);
}
function finirGlisse(deposer){
  var g=glisse;glisse=null;
  clearTimeout(g.timer);
  if(!g.actif)return;
  var z=deposer?zoneSous(g.x,g.y):null;
  g.ghost.remove();g.row.classList.remove('soulevee');document.body.classList.remove('glisse');
  if(g.zone)g.zone.classList.remove('cible');
  apresGlisse=true;setTimeout(function(){apresGlisse=false},60);
  if(g.ev&&z){
    var pv=participation(g.ev,jourVu);
    if(z.id==='reserve'){if(pv)poserParticipation(g.ev,'');}
    else if(!pv)poserParticipation(g.ev,'choisi');
    rendre();return;
  }
  if(g.e&&z){
    var a=avanceeDe(g.e,jourVu);
    if(z.id==='reserve'){
      if(a){
        D.avancees=D.avancees.filter(function(x){return x!==a});
        google.script.run.withFailureHandler(echecServeur).retirerAvancee(g.e,jourVu);
      }
    }else if(!a){
      D.avancees.push({jour:jourVu,elan:g.e,moment:z.dataset.m,fait:false,note:''});
      google.script.run.withFailureHandler(echecServeur).majAvancee(g.e,jourVu,{moment:z.dataset.m,fait:false});
    }else if(a.moment!==z.dataset.m){
      a.moment=z.dataset.m;
      google.script.run.withFailureHandler(echecServeur).majAvancee(g.e,jourVu,{moment:a.moment});
    }
    if(z.id!=='reserve')reordonner(z,g);
    rendre();return;
  }
  if(g.lie&&z){
    var x=elementId(g.lie),tx=x&&tacheId(x.tache);
    if(x&&tx)placerElement(x,tx,z.id==='reserve'?'':z.dataset.m);
    rendre();return;
  }
  if(g.pose&&z){
    var pz=D.poses.filter(function(q){return q.id===g.pose})[0];
    if(pz)deplacerPose(pz,z.id==='reserve'?'':z.dataset.m);
    rendre();return;
  }
  var t=trouve(g.l);if(!t||!z)return;
  if(estMulti(t)){if(z.id==='reserve'&&foisDuJour(t).length)retirerAuto(t);rendre();return;}
  if(finieAvant(t))renouvelerLocal(t);
  if(z.id==='reserve'){
    if(estRecurrente(t)&&t.statut==='fait'&&t.jour===jourVu){var a0=t.avancement;t.avancement=0;t.statut='a faire';t.fait_le='';suivreAvancement(t,a0);envoyer(t.ligne,{avancement:0,statut:'a faire'});}
    var auto=autoDuJour(t)||(estAuto(t)&&t.moment&&t.jour===jourVu);
    if(t.moment&&t.jour===jourVu){
      t.moment='';t.jour='';
      google.script.run.withFailureHandler(echecServeur).retirerDuJour(Number(t.ligne),t.id);
    }
    if(auto)retirerAuto(t);
  }else if(t.moment!==z.dataset.m||t.jour!==jourVu){
    garderTrace(t,jourVu);
    t.moment=z.dataset.m;t.jour=jourVu;
    google.script.run.withFailureHandler(echecServeur).setMoment(Number(t.ligne),t.moment,jourVu,t.id);
  }
  if(z.id!=='reserve')reordonner(z,g);
  rendre();
}
function echecServeur(e){document.getElementById('hint').textContent='Non enregistré : '+e.message}

document.addEventListener('pointerdown',function(e){
  if(e.button)return;
  var row=e.target.closest('#jour .t');
  if(!row||row.classList.contains('bloq')||e.target.closest('.ring,button'))return;
  if(row.classList.contains('evt')&&!row.classList.contains('facu'))return;
  if(row.classList.contains('trace'))return;   // la trace d'un jour passé ne se déplace pas
  glisse={row:row,l:row.dataset.l,e:row.dataset.e,ev:row.dataset.ev,lie:row.dataset.lie,pose:row.dataset.pose,id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,
    touch:e.pointerType!=='mouse',actif:false};
  if(glisse.touch)glisse.timer=setTimeout(function(){if(glisse&&!glisse.actif)demarrerGlisse(glisse.x,glisse.y)},280);
});
document.addEventListener('pointermove',function(e){
  if(!glisse||e.pointerId!==glisse.id)return;
  if(glisse.actif){bougerGlisse(e.clientX,e.clientY);return;}
  var d=Math.hypot(e.clientX-glisse.x0,e.clientY-glisse.y0);
  if(glisse.touch){if(d>8){clearTimeout(glisse.timer);glisse=null;}return;}
  if(d>6){demarrerGlisse(e.clientX,e.clientY);bougerGlisse(e.clientX,e.clientY);}
});
document.addEventListener('pointerup',function(e){if(glisse&&e.pointerId===glisse.id)finirGlisse(true)});
document.addEventListener('pointercancel',function(e){if(glisse&&e.pointerId===glisse.id)finirGlisse(false)});
document.addEventListener('touchmove',function(e){if(glisse&&glisse.actif)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(glisse)e.preventDefault()});

function appliquer(d){
  var ancien=AUJ;
  D=d;D.archives=D.archives||[];D.idees=D.idees||[];D.films=(D.films||[]).map(function(m){m.type='film';return m});D.series=(D.series||[]).map(function(m){m.type='serie';return m});D.visionnages=D.visionnages||[];D.episodes=D.episodes||[];D.listes=D.listes||[];D.poses=D.poses||[];D.progres=D.progres||[];D.souhaits=D.souhaits||[];D.journal=D.journal||[];reprendreBrouillon();D.rappels=(D.rappels||[]).map(function(r){r.debut=r.debut||'';r.fin=r.fin||'';return r});AUJ=d.aujourdhui;
  if(jourVu===null||jourVu===ancien)jourVu=AUJ;
  if(d.calendriersEnErreur&&d.calendriersEnErreur.length)
    document.getElementById('hint').textContent='Calendrier qui ne répond pas pour l\'instant : '+d.calendriersEnErreur.join(', ')+'.';
  document.getElementById('load').classList.add('hide');
  document.getElementById(vue).classList.remove('hide');
  maj();rendre();
}
var CLE_COPIE='systeme-donnees-v1',gestes=0,relances=0;
['click','pointerup','change','keydown'].forEach(function(t){document.addEventListener(t,function(){gestes++},true)});
function charger(){
  var depart=gestes,v0=vEcr;
  google.script.run.withSuccessHandler(function(d){
    if(enVol>0||vEcr!==v0){setTimeout(charger,900);return;}
    if(gestes!==depart&&relances<3){relances++;setTimeout(charger,enCopie?1500:800);return;}
    try{localStorage.setItem(CLE_COPIE,JSON.stringify(d))}catch(_){}
    relances=0;enCopie=false;appliquer(d);
    document.body.classList.remove('copie');
  }).withFailureHandler(function(e){
    if(enCopie)document.getElementById('hint').textContent='Pas de connexion au Sheet : affichage du dernier chargement.';
    else document.getElementById('load').textContent='Erreur : '+e.message;
  }).getData();
}
var enCopie=false;
try{var copie=JSON.parse(localStorage.getItem(CLE_COPIE)||'null');
  if(copie&&copie.aujourdhui===iso(new Date())){enCopie=true;appliquer(copie);document.body.classList.add('copie');}}catch(_){enCopie=false}
charger();
setInterval(maj,30000);
